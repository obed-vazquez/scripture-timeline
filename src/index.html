<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Línea del Tiempo Bíblica</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Línea del tiempo interactiva de la historia de la Biblia, sus traducciones, la doctrina cristiana y la historia de la iglesia.">
  <meta name="theme-color" content="#101216">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Inter:wght@400;500;600&display=swap">
  <script>
    // Apply the saved theme before the first paint (no flash).
    try {
      var t = localStorage.getItem('theme');
      var dark = t ? t === 'dark' : !window.matchMedia || window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
